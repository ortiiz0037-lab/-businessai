name: CI

on:
  pull_request:
  push:
    branches: [main, staging, 'claude/**']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: businessai-fase1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: businessai-fase1/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
      - name: Build (placeholder public config, no secrets)
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: placeholder
          NEXT_TELEMETRY_DISABLED: '1'
      - name: Database tests (throw-away local PostgreSQL, never Supabase)
        run: npm run test:db
