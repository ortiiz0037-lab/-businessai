name: Production secret probe (temporary diagnostic, no values)

# TEMPORARY. Why does a job in Environment "production" get PRODUCTION_DB_URL empty (runs #1, #3, #6) while the
# repository secret STAGING_DB_URL arrives? Two facts decide it, and neither needs a secret value:
#   1. WHICH environment entries exist (name + id) and which one GitHub recorded for THIS job's deployment
#      (public metadata, read with the job's own token: duplicate or look-alike entries show up here);
#   2. whether the answer depends on the EVENT: label on the PR (pull_request, ref refs/pull/1/merge) vs a push to
#      the authorised branch (push, ref refs/heads/…).
# Prints only names, ids, event/ref and true/false. No checkout, no database, no secret value, no artifact.
# Each job waits for the owner's approval in the Environment. To be removed after the single diagnostic run.

on:
  pull_request:
    types: [labeled]
  push:
    branches: [claude/businessai-platform-audit-vjjcoc]
    paths: ['.github/production-secret-probe-request.txt']

permissions:
  contents: read
  deployments: read

jobs:
  probe:
    if: >-
      (github.event_name == 'pull_request' && github.event.label.name == 'production:secret-probe' &&
       github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'push' && github.ref == 'refs/heads/claude/businessai-platform-audit-vjjcoc')
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      HAS_PROD_URL: ${{ secrets.PRODUCTION_DB_URL != '' }}
      HAS_PROD_KEY: ${{ secrets.PRODUCTION_BACKUP_PASSPHRASE != '' }}
      HAS_REPO_SECRET: ${{ secrets.STAGING_DB_URL != '' }}
      HAS_ENV_MARKER: ${{ vars.PRODUCTION_ENV_MARKER == '1' }}
    steps:
      - name: Presence (true/false only) and event
        run: |
          echo "event: ${{ github.event_name }} · ref: ${{ github.ref }} · actor: ${{ github.actor }} · triggering actor: ${{ github.triggering_actor }}"
          echo "environment secret PRODUCTION_DB_URL present: $HAS_PROD_URL"
          echo "environment secret PRODUCTION_BACKUP_PASSPHRASE present: $HAS_PROD_KEY"
          echo "repository secret STAGING_DB_URL present: $HAS_REPO_SECRET"
          echo "variable PRODUCTION_ENV_MARKER = 1: $HAS_ENV_MARKER"
      - name: Environment entries and the deployment recorded for this job (names and ids only)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "environments in the repository:"
          gh api "repos/${{ github.repository }}/environments" --jq '.environments[] | "  id \(.id) · name \(.name | @json) · length \(.name | length) · reviewers \([.protection_rules[]? | select(.type == "required_reviewers") | .reviewers[]?] | length) · branch policy \(.deployment_branch_policy | @json)"'
          echo "deployments for this commit (latest first):"
          gh api "repos/${{ github.repository }}/deployments?sha=${{ github.sha }}&per_page=5" --jq '.[] | "  deployment \(.id) · environment \(.environment | @json) · original \(.original_environment | @json) · created \(.created_at)"' || echo "  (none readable)"
