name: Production environment probe (temporary diagnostic)

# TEMPORARY diagnostic: does a job bound to the GitHub Environment "production" receive that Environment's
# variable PRODUCTION_ENV_MARKER, and does the answer depend on the event (PR label vs push)?
#   label `production:probe` on the PR        → job runs from a pull_request event
#   push that changes .github/production-probe-request.txt on the authorised branch → job runs from a push event
# Each job waits for the owner's approval (the Environment's required reviewer) and prints ONLY the event name
# and true/false. No checkout, no secrets, no database, no database tools, no network call.
# To be removed after the diagnosis.

on:
  pull_request:
    types: [labeled]
  push:
    branches: [claude/businessai-platform-audit-vjjcoc]
    paths: ['.github/production-probe-request.txt']

permissions:
  contents: read

jobs:
  probe:
    if: >-
      (github.event_name == 'pull_request' && github.event.label.name == 'production:probe' &&
       github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'push' && github.ref == 'refs/heads/claude/businessai-platform-audit-vjjcoc')
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: "PRODUCTION_ENV_MARKER received (true/false only)"
        env:
          ENV_VARIABLE_MARKER: ${{ vars.PRODUCTION_ENV_MARKER == '1' }}
        run: |
          echo "event: ${{ github.event_name }}"
          echo "environment variable PRODUCTION_ENV_MARKER = 1: $ENV_VARIABLE_MARKER"
